<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Обувной Магазин</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#000000" />

    <style>
      body {
        background-color: #000000;
        color: #ffffff;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .custom-scrollbar::-webkit-scrollbar {
        height: 4px;
        width: 4px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #3f3f46;
        border-radius: 4px;
      }
    </style>
  </head>
  <body class="bg-black text-white pb-10">
    <!-- Шапка -->
    <header
      class="sticky top-0 z-20 bg-black border-b border-zinc-800 px-3 py-3 flex items-center justify-between"
    >
      <!-- Левая часть: Статистика (только админ) и Вход/Выход Админа -->
      <div class="flex items-center space-x-2">
        <button
          id="stats-action-btn"
          onclick="openStatsModal()"
          title="Статистика"
          class="hidden p-2.5 bg-zinc-800 hover:bg-zinc-700 rounded-xl text-blue-400 items-center justify-center"
        >
          <svg
            class="w-5 h-5"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"
            />
          </svg>
        </button>

        <button
          id="auth-action-btn"
          onclick="handleAuthClick()"
          class="text-xs font-semibold px-3 py-2.5 rounded-xl bg-zinc-800 hover:bg-zinc-700 text-blue-400"
        >
          Войти как админ
        </button>
      </div>

      <!-- Правая часть: Фильтр и Добавление товара -->
      <div class="flex items-center space-x-2">
        <button
          onclick="openFilter()"
          class="p-2.5 bg-zinc-800 hover:bg-zinc-700 rounded-xl text-white relative"
        >
          <svg
            class="w-5 h-5"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"
            />
          </svg>
          <span
            id="filter-indicator"
            class="hidden absolute top-1 right-1 w-2.5 h-2.5 bg-blue-500 rounded-full"
          ></span>
        </button>

        <button
          id="add-product-btn"
          onclick="openAddModal()"
          class="hidden items-center space-x-1 bg-blue-600 hover:bg-blue-500 text-white font-medium px-3.5 py-2.5 rounded-xl text-sm transition"
        >
          <svg
            class="w-4 h-4"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2.5"
              d="M12 4v16m8-8H4"
            />
          </svg>
          <span>Add</span>
        </button>
      </div>
    </header>

    <!-- Сетка товаров -->
    <main class="p-3 bg-black min-h-screen">
      <div id="product-grid" class="grid grid-cols-2 gap-1"></div>
    </main>

    <!-- Модальное окно Статистики -->
    <div
      id="stats-modal"
      class="fixed inset-0 bg-black z-50 hidden overflow-y-auto"
    >
      <div class="min-h-screen bg-black p-4 max-w-lg mx-auto">
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-xl font-bold text-white">Статистика остатков</h2>
          <button
            onclick="closeStatsModal()"
            class="p-1 text-white hover:text-blue-400"
          >
            <svg
              class="w-6 h-6"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M6 18L18 6M6 6l12 12"
              />
            </svg>
          </button>
        </div>

        <!-- 1. Параметры/Фильтры для статистики -->
        <div
          class="space-y-4 mb-6 bg-zinc-900 p-4 rounded-2xl border border-zinc-800"
        >
          <div>
            <label class="text-xs font-semibold text-white mb-2 block"
              >Тип</label
            >
            <div id="stats-types" class="flex flex-wrap gap-1.5"></div>
          </div>
          <div>
            <label class="text-xs font-semibold text-white mb-2 block"
              >Пол</label
            >
            <div id="stats-genders" class="flex flex-wrap gap-1.5"></div>
          </div>
          <div>
            <label class="text-xs font-semibold text-white mb-2 block"
              >Цвет</label
            >
            <div id="stats-colors" class="flex flex-wrap gap-1.5"></div>
          </div>
          <div>
            <label class="text-xs font-semibold text-white mb-2 block"
              >Параметры</label
            >
            <div id="stats-params" class="flex flex-wrap gap-1.5"></div>
          </div>
        </div>

        <!-- 2. График остатков -->
        <div class="mb-6 bg-zinc-900 p-4 rounded-2xl border border-zinc-800">
          <div class="flex justify-between items-center mb-3">
            <h3 class="text-sm font-semibold text-white">График по размерам</h3>
            <span
              id="selected-chart-info"
              class="text-xs text-blue-400 font-medium"
            ></span>
          </div>

          <div class="overflow-x-auto custom-scrollbar pb-2">
            <div id="chart-container" class="min-w-[650px] h-48 relative"></div>
          </div>
        </div>

        <!-- 3. Список количества по размерам -->
        <div class="mb-6 bg-zinc-900 p-4 rounded-2xl border border-zinc-800">
          <h3 class="text-sm font-semibold text-white mb-3">
            Количество по размерам
          </h3>
          <div id="stats-list" class="grid grid-cols-2 gap-2 text-sm"></div>
        </div>

        <!-- 4. Итоговый блок в самом низу -->
        <div
          id="stats-summary"
          class="bg-zinc-900 p-4 rounded-2xl border border-zinc-800 space-y-2"
        ></div>
      </div>
    </div>

    <!-- Модальное окно Входа (Admin Auth) -->
    <div
      id="auth-modal"
      class="fixed inset-0 bg-black z-50 hidden flex items-center justify-center p-4"
    >
      <div
        class="bg-zinc-900 border border-zinc-800 rounded-2xl p-6 w-full max-w-sm"
      >
        <h2 class="text-lg font-bold text-white mb-4">Вход администратора</h2>
        <input
          type="email"
          id="auth-email"
          placeholder="Email"
          class="w-full bg-zinc-800 border border-zinc-700 text-white rounded-xl px-4 py-2.5 text-sm mb-3 focus:outline-none focus:border-blue-500"
        />
        <input
          type="password"
          id="auth-password"
          placeholder="Пароль"
          class="w-full bg-zinc-800 border border-zinc-700 text-white rounded-xl px-4 py-2.5 text-sm mb-4 focus:outline-none focus:border-blue-500"
        />
        <div class="flex space-x-2">
          <button
            onclick="closeAuthModal()"
            class="w-1/2 py-2.5 bg-zinc-800 text-white rounded-xl font-medium text-sm"
          >
            Отмена
          </button>
          <button
            onclick="loginAdmin()"
            class="w-1/2 py-2.5 bg-blue-600 text-white rounded-xl font-medium text-sm"
          >
            Войти
          </button>
        </div>
      </div>
    </div>

    <!-- Фильтр (На весь экран) -->
    <div
      id="filter-modal"
      class="fixed inset-0 bg-black z-50 hidden flex flex-col h-screen w-screen"
    >
      <div class="bg-black p-4 flex-1 flex flex-col overflow-hidden">
        <div
          class="flex justify-between items-center pb-4 border-b border-zinc-800"
        >
          <h3 class="text-xl font-bold text-white">Фильтр</h3>
          <button
            onclick="closeFilter()"
            class="p-1 text-white hover:text-blue-400"
          >
            <svg
              class="w-7 h-7"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M6 18L18 6M6 6l12 12"
              />
            </svg>
          </button>
        </div>

        <div class="overflow-y-auto py-4 space-y-6 custom-scrollbar flex-1">
          <div>
            <label class="text-base font-semibold text-white mb-2.5 block"
              >Тип</label
            >
            <div id="filter-type-group" class="flex flex-wrap gap-2"></div>
          </div>
          <div>
            <label class="text-base font-semibold text-white mb-2.5 block"
              >Пол</label
            >
            <div id="filter-gender-group" class="flex flex-wrap gap-2"></div>
          </div>
          <div>
            <label class="text-base font-semibold text-white mb-2.5 block"
              >Цвет</label
            >
            <div id="filter-color-group" class="flex flex-wrap gap-2"></div>
          </div>
          <div>
            <label class="text-base font-semibold text-white mb-2.5 block"
              >Параметры</label
            >
            <div id="filter-params-group" class="flex flex-wrap gap-2"></div>
          </div>
          <div>
            <label class="text-base font-semibold text-white mb-2.5 block"
              >Размеры</label
            >
            <div id="filter-sizes-group" class="grid grid-cols-6 gap-1.5"></div>
          </div>
        </div>

        <div class="pt-4 border-t border-zinc-800 grid grid-cols-2 gap-3">
          <button
            onclick="resetFilters()"
            class="py-3.5 bg-zinc-800 hover:bg-zinc-700 text-white font-semibold rounded-xl text-base"
          >
            Очистить все
          </button>
          <button
            onclick="applyFilters()"
            class="py-3.5 bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded-xl text-base"
          >
            Готово
          </button>
        </div>
      </div>
    </div>

    <!-- Окно Просмотра Товара -->
    <div
      id="product-detail-modal"
      class="fixed inset-0 bg-black z-50 hidden overflow-y-auto"
    >
      <div
        class="min-h-screen bg-black p-4 flex flex-col justify-between max-w-lg mx-auto"
      >
        <div>
          <button
            onclick="closeProductDetail()"
            class="p-2 bg-zinc-900 rounded-full text-white mb-4"
          >
            <svg
              class="w-6 h-6"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M10 19l-7-7m0 0l7-7m-7 7h18"
              />
            </svg>
          </button>
          <div id="detail-content"></div>
        </div>

        <div
          id="admin-detail-actions"
          class="hidden space-y-3 pt-6 border-t border-zinc-800"
        >
          <button
            onclick="openEditModalCurrent()"
            class="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded-xl text-sm"
          >
            Изменить
          </button>
          <button
            onclick="deleteCurrentProduct()"
            class="w-full py-3 bg-zinc-800 text-red-500 hover:bg-zinc-700 font-semibold rounded-xl text-sm"
          >
            Удалить
          </button>
        </div>
      </div>
    </div>

    <!-- Модалка Добавления / Изменения Товара -->
    <div
      id="form-modal"
      class="fixed inset-0 bg-black z-50 hidden overflow-y-auto"
    >
      <div class="min-h-screen bg-black p-4 max-w-lg mx-auto">
        <div class="flex justify-between items-center mb-6">
          <h2 id="form-title" class="text-2xl font-bold text-white">
            Добавить позицию
          </h2>
          <button
            onclick="closeFormModal()"
            class="p-1 text-white hover:text-blue-400"
          >
            <svg
              class="w-7 h-7"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M6 18L18 6M6 6l12 12"
              />
            </svg>
          </button>
        </div>

        <div class="space-y-6">
          <div>
            <label class="text-base font-medium text-white block mb-1.5"
              >Цена</label
            >
            <input
              type="number"
              id="form-price"
              placeholder="например 200"
              class="w-full bg-zinc-800 border border-zinc-700 text-white rounded-xl px-4 py-3 text-base focus:outline-none focus:border-blue-500"
            />
          </div>

          <div>
            <label class="text-base font-medium text-white block mb-1.5"
              >Фото товара</label
            >
            <input
              type="file"
              id="input-photo-file"
              accept="image/*"
              onchange="handleImageUpload(event, 'photo')"
              class="hidden"
            />
            <input
              type="file"
              id="input-photo-camera"
              accept="image/*"
              capture="environment"
              onchange="handleImageUpload(event, 'photo')"
              class="hidden"
            />
            <div class="grid grid-cols-2 gap-2">
              <button
                type="button"
                onclick="document.getElementById('input-photo-camera').click()"
                class="py-3 px-4 bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 rounded-xl text-sm font-medium text-white text-center transition"
              >
                Камера
              </button>
              <button
                type="button"
                onclick="document.getElementById('input-photo-file').click()"
                class="py-3 px-4 bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 rounded-xl text-sm font-medium text-white text-center transition"
              >
                Файл
              </button>
            </div>
            <div
              id="preview-photo"
              class="mt-2 hidden h-24 w-24 rounded-xl overflow-hidden border border-zinc-700"
            >
              <img src="" class="w-full h-full object-cover" />
            </div>
          </div>

          <div>
            <label class="text-base font-medium text-white block mb-1.5"
              >Расположение</label
            >
            <input
              type="file"
              id="input-locationPhoto-file"
              accept="image/*"
              onchange="handleImageUpload(event, 'locationPhoto')"
              class="hidden"
            />
            <input
              type="file"
              id="input-locationPhoto-camera"
              accept="image/*"
              capture="environment"
              onchange="handleImageUpload(event, 'locationPhoto')"
              class="hidden"
            />
            <div class="grid grid-cols-2 gap-2">
              <button
                type="button"
                onclick="
                  document.getElementById('input-locationPhoto-camera').click()
                "
                class="py-3 px-4 bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 rounded-xl text-sm font-medium text-white text-center transition"
              >
                Камера
              </button>
              <button
                type="button"
                onclick="
                  document.getElementById('input-locationPhoto-file').click()
                "
                class="py-3 px-4 bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 rounded-xl text-sm font-medium text-white text-center transition"
              >
                Файл
              </button>
            </div>
            <div
              id="preview-locationPhoto"
              class="mt-2 hidden h-24 w-24 rounded-xl overflow-hidden border border-zinc-700"
            >
              <img src="" class="w-full h-full object-cover" />
            </div>
          </div>

          <div>
            <label class="text-base font-medium text-white block mb-2.5"
              >Тип</label
            >
            <div id="form-type-group" class="flex flex-wrap gap-2"></div>
          </div>

          <div>
            <label class="text-base font-medium text-white block mb-2.5"
              >Пол</label
            >
            <div id="form-gender-group" class="flex flex-wrap gap-2"></div>
          </div>

          <div>
            <label class="text-base font-medium text-white block mb-2.5"
              >Цвет</label
            >
            <div id="form-color-group" class="flex flex-wrap gap-2"></div>
          </div>

          <div>
            <label class="text-base font-medium text-white block mb-2.5"
              >Параметры</label
            >
            <div id="form-params-group" class="flex flex-wrap gap-2"></div>
          </div>

          <div>
            <label class="text-base font-medium text-white block mb-2.5"
              >Размеры</label
            >
            <div id="form-sizes-group" class="grid grid-cols-6 gap-1.5"></div>
          </div>

          <div>
            <label class="text-base font-medium text-white block mb-2.5"
              >Доп. размеры</label
            >
            <div
              id="form-extra-sizes-group"
              class="grid grid-cols-6 gap-1.5"
            ></div>
          </div>

          <div class="pt-4 grid grid-cols-2 gap-3">
            <button
              onclick="closeFormModal()"
              class="py-3.5 bg-zinc-800 text-white font-semibold rounded-xl text-base"
            >
              Отменить
            </button>
            <button
              onclick="saveProduct()"
              class="py-3.5 bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded-xl text-base"
            >
              Отправить
            </button>
          </div>
        </div>
      </div>
    </div>

    <script>
      const firebaseConfig = {
        apiKey: "AIzaSyAQX3FCLXxm3pagakyTHqMXQR-HRLEud9E",
        authDomain: "shoesstore-e057c.firebaseapp.com",
        projectId: "shoesstore-e057c",
        storageBucket: "shoesstore-e057c.firebasestorage.app",
        messagingSenderId: "223432210569",
        appId: "1:223432210569:web:8ffc67cc1b152ad5a2ee58",
        measurementId: "G-RER47GLJFX",
      };

      let isFirebaseReady = false;
      try {
        if (firebaseConfig.apiKey !== "YOUR_API_KEY") {
          firebase.initializeApp(firebaseConfig);
          isFirebaseReady = true;
        }
      } catch (e) {}

      const db = isFirebaseReady ? firebase.firestore() : null;
      const auth = isFirebaseReady ? firebase.auth() : null;

      const TYPES = ["Кроссовки", "Ботинки", "Туфли", "Балетки"];
      const GENDERS = ["М", "Д"];
      const COLORS = [
        "Чёрный",
        "Белый",
        "Розовый",
        "Красный",
        "Зелёный",
        "Серый",
        "Синий",
        "Бежевый",
        "Жёлтый",
        "Оранжевый",
        "Коричневый",
        "Фиолетовый",
      ];
      const PARAMS = ["Тёплый", "Кеды", "Сетка", "Камни"];
      const ALL_SIZES = Array.from({ length: 26 }, (_, i) => i + 16);

      let products = [];
      let currentAdmin = false;
      let selectedProductId = null;

      let filters = {
        types: [],
        genders: [],
        colors: [],
        params: [],
        sizes: [],
      };
      let formData = {
        types: [],
        genders: [],
        colors: [],
        params: [],
        sizes: [],
        extraSizes: [],
        photo: "",
        locationPhoto: "",
      };
      let statsFilters = { types: [], genders: [], colors: [], params: [] };

      window.addEventListener("DOMContentLoaded", () => {
        initFilterOptions();
        initFormOptions();
        listenAuthChanges();
        loadProducts();
      });

      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./sw.js").catch((err) => {
            console.error("Ошибка регистрации Service Worker:", err);
          });
        });
      }

      function listenAuthChanges() {
        if (isFirebaseReady) {
          auth.onAuthStateChanged((user) => {
            currentAdmin = !!user;
            updateAdminUI();
          });
        }
      }

      function updateAdminUI() {
        const statsBtn = document.getElementById("stats-action-btn");
        const addBtn = document.getElementById("add-product-btn");
        const authBtn = document.getElementById("auth-action-btn");
        const adminDetailActions = document.getElementById(
          "admin-detail-actions",
        );
        const statsModal = document.getElementById("stats-modal");

        if (currentAdmin) {
          statsBtn.classList.remove("hidden");
          statsBtn.classList.add("flex");
          addBtn.classList.remove("hidden");
          addBtn.classList.add("flex");
          authBtn.innerText = "Выйти";
          adminDetailActions.classList.remove("hidden");
        } else {
          statsBtn.classList.add("hidden");
          statsBtn.classList.remove("flex");
          addBtn.classList.add("hidden");
          addBtn.classList.remove("flex");
          authBtn.innerText = "Войти как админ";
          adminDetailActions.classList.add("hidden");
          statsModal.classList.add("hidden");
        }

        renderProducts();
        if (currentAdmin && !statsModal.classList.contains("hidden")) {
          updateStats();
        }
        if (
          !document
            .getElementById("product-detail-modal")
            .classList.contains("hidden") &&
          selectedProductId
        ) {
          openProductDetail(selectedProductId);
        }
      }

      function handleAuthClick() {
        if (currentAdmin) {
          if (isFirebaseReady) auth.signOut();
          else {
            currentAdmin = false;
            updateAdminUI();
          }
        } else {
          document.getElementById("auth-modal").classList.remove("hidden");
        }
      }

      function closeAuthModal() {
        document.getElementById("auth-modal").classList.add("hidden");
      }

      async function loginAdmin() {
        const email = document.getElementById("auth-email").value;
        const pass = document.getElementById("auth-password").value;
        if (isFirebaseReady) {
          try {
            await auth.signInWithEmailAndPassword(email, pass);
            closeAuthModal();
          } catch (e) {
            showBottomToast("Ошибка входа: " + e.message, "error");
          }
        } else {
          if (pass === "admin") {
            currentAdmin = true;
            updateAdminUI();
            closeAuthModal();
          } else {
            showBottomToast("Пароль: admin", "error");
          }
        }

      function compressImageFile(file, maxDimension = 1000) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
              let width = img.width;
              let height = img.height;

              if (width > height) {
                if (width > maxDimension) {
                  height = Math.round((height * maxDimension) / width);
                  width = maxDimension;
                }
              } else {
                if (height > maxDimension) {
                  width = Math.round((width * maxDimension) / height);
                  height = maxDimension;
                }
              }

              const canvas = document.createElement("canvas");
              canvas.width = width;
              canvas.height = height;
              const ctx = canvas.getContext("2d");
              ctx.drawImage(img, 0, 0, width, height);

              let quality = 0.8;
              let dataUrl = canvas.toDataURL("image/jpeg", quality);

              const getKbSize = (str) =>
                Math.round((str.length * (3 / 4)) / 1024);

              while (getKbSize(dataUrl) > 100 && quality > 0.25) {
                quality -= 0.05;
                dataUrl = canvas.toDataURL("image/jpeg", quality);
              }

              if (getKbSize(dataUrl) > 100 && maxDimension > 500) {
                resolve(compressImageFile(file, maxDimension - 150));
                return;
              }

              resolve(dataUrl);
            };
            img.onerror = reject;
            img.src = e.target.result;
          };
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });
      }

      async function flushPendingQueue() {
        if (!isFirebaseReady) return;
        const queue = getPendingQueue();
        if (queue.length === 0) return;

        const remaining = [];
        for (const task of queue) {
          try {
            if (task.mode === "update" && task.productId) {
              await db
                .collection("products")
                .doc(task.productId)
                .update(task.payload);
              showBottomToast("Изменено", "success");
            } else {
              await db.collection("products").add(task.payload);
              showBottomToast("Отправлено", "success");
            }
          } catch (err) {
            remaining.push(task);
          }
        }
        setPendingQueue(remaining);
      }

      function parseCsvRows(text) {
        const rows = [];
        let row = [];
        let field = "";
        let inQuotes = false;

        for (let i = 0; i < text.length; i++) {
          const ch = text[i];
          const next = text[i + 1];
          if (inQuotes) {
            if (ch === '"' && next === '"') {
              field += '"';
              i++;
            } else if (ch === '"') {
              inQuotes = false;
            } else {
              field += ch;
            }
          } else {
            if (ch === '"') {
              inQuotes = true;
            } else if (ch === ",") {
              row.push(field);
              field = "";
            } else if (ch === "\n" || (ch === "\r" && next === "\n")) {
              row.push(field);
              rows.push(row);
              row = [];
              field = "";
              if (ch === "\r") i++;
            } else {
              field += ch;
            }
          }
        }
        if (field.length > 0 || row.length > 0) {
          row.push(field);
          rows.push(row);
        }
        return rows;
      }

      function splitList(val) {
        if (!val) return [];
        return String(val)
          .split(",")
          .map((s) => s.trim())
          .filter(Boolean);
      }

      function splitNumbers(val) {
        return splitList(val)
          .map((n) => Number(n))
          .filter((n) => !Number.isNaN(n));
      }

      async function handleCsvImport(event) {
        const file = event.target.files[0];
        event.target.value = "";
        if (!file) return;
        if (!currentAdmin) {
          showBottomToast("Войдите как администратор для импорта", "error");
          return;
        }

        const text = await file.text();
        const rows = parseCsvRows(text);
        if (rows.length < 2) {
          showBottomToast(
            "CSV файл пуст или не содержит строк товаров",
            "error",
          );
          return;
        }

        const headers = rows[0].map((h) => h.replace(/^\uFEFF/, "").trim());
        const colIdx = (name) => headers.indexOf(name);

        const idxPhoto = colIdx("Фото");
        const idxPrice = colIdx("Цена");
        const idxType = colIdx("Тип");
        const idxGender = colIdx("Пол");
        const idxColor = colIdx("Цвет");
        const idxLocation = colIdx("Расположение");
        const idxSizes = colIdx("Размеры");
        const idxExtra = colIdx("Доп размеры");
        const idxParams = colIdx("Параметры");

        const items = [];
        for (let r = 1; r < rows.length; r++) {
          const cols = rows[r];
          if (!cols || cols.length === 0 || cols.every((c) => !c.trim()))
            continue;

          const photo = idxPhoto >= 0 ? (cols[idxPhoto] || "").trim() : "";
          const locationPhoto =
            idxLocation >= 0 ? (cols[idxLocation] || "").trim() : "";
          const price =
            idxPrice >= 0
              ? Number(
                  String(cols[idxPrice] || "0")
                    .replace(",", ".")
                    .trim(),
                ) || 0
              : 0;

          items.push({
            price,
            photo,
            locationPhoto,
            types: idxType >= 0 ? splitList(cols[idxType]) : [],
            genders: idxGender >= 0 ? splitList(cols[idxGender]) : [],
            colors: idxColor >= 0 ? splitList(cols[idxColor]) : [],
            params: idxParams >= 0 ? splitList(cols[idxParams]) : [],
            sizes: idxSizes >= 0 ? splitNumbers(cols[idxSizes]) : [],
            extraSizes: idxExtra >= 0 ? splitNumbers(cols[idxExtra]) : [],
          });
        }

        if (!confirm(`Найдено позиций: ${items.length}. Загрузить их в базу?`))
          return;

        try {
          if (isFirebaseReady) {
            for (let i = 0; i < items.length; i += 400) {
              const batch = db.batch();
              const chunk = items.slice(i, i + 400);
              chunk.forEach((item) => {
                const ref = db.collection("products").doc();
                batch.set(ref, item);
              });
              await batch.commit();
            }
            showBottomToast(
              `Успешно загружено позиций: ${items.length}`,
              "success",
            );
          } else {
            products = [
              ...products,
              ...items.map((it, idx) => ({
                id: "csv_" + Date.now() + "_" + idx,
                ...it,
              })),
            ];
            localStorage.setItem("my_shoes_catalog", JSON.stringify(products));
            renderProducts();
            showBottomToast(`Добавлено локально: ${items.length}`, "success");
          }
        } catch (err) {
          showBottomToast("Ошибка при импорте: " + err.message, "error");
        }
      }

      function updateStats() {
        const sizeCounts = {};
        ALL_SIZES.forEach((s) => (sizeCounts[s] = 0));

        let totalPairs = 0;
        let totalPriceRaw = 0;

        products.forEach((p) => {
          if (!matchArray(p.types || p.type, statsFilters.types)) return;
          if (!matchArray(p.genders || p.gender, statsFilters.genders)) return;
          if (!matchArray(p.colors || p.color, statsFilters.colors)) return;
          if (!matchArray(p.params || p.param, statsFilters.params)) return;

          const allProductSizes = [...(p.sizes || []), ...(p.extraSizes || [])];
          let productPairsCount = 0;

          allProductSizes.forEach((s) => {
            if (sizeCounts[s] !== undefined) {
              sizeCounts[s]++;
              productPairsCount++;
              totalPairs++;
            }
          });

          totalPriceRaw += productPairsCount * Number(p.price || 0);
        });

        const finalTotalPrice = totalPriceRaw * 1000;

        renderChart(sizeCounts);
        renderStatsList(sizeCounts);
        renderStatsSummary(totalPairs, finalTotalPrice);
      }

      function renderChart(sizeCounts) {
        const container = document.getElementById("chart-container");
        container.innerHTML = "";

        const infoSpan = document.getElementById("selected-chart-info");
        infoSpan.innerText = "Нажмите на столбец";

        const maxVal = Math.max(...Object.values(sizeCounts), 5);
        const svgNS = "http://www.w3.org/2000/svg";
        const svg = document.createElementNS(svgNS, "svg");
        svg.setAttribute("width", "100%");
        svg.setAttribute("height", "100%");
        svg.setAttribute("viewBox", `0 0 650 180`);

        const colWidth = 650 / ALL_SIZES.length;

        ALL_SIZES.forEach((size, idx) => {
          const count = sizeCounts[size];
          const barHeight = (count / maxVal) * 120;
          const x = idx * colWidth + 4;
          const y = 140 - barHeight;

          const g = document.createElementNS(svgNS, "g");
          g.style.cursor = "pointer";
          g.onclick = () => {
            infoSpan.innerText = `Размер ${size}: ${count} шт.`;
          };

          const rect = document.createElementNS(svgNS, "rect");
          rect.setAttribute("x", x);
          rect.setAttribute("y", y);
          rect.setAttribute("width", colWidth - 8);
          rect.setAttribute("height", barHeight);
          rect.setAttribute("rx", "4");
          rect.setAttribute("fill", count > 0 ? "#3b82f6" : "#27272a");

          const textX = document.createElementNS(svgNS, "text");
          textX.setAttribute("x", x + (colWidth - 8) / 2);
          textX.setAttribute("y", 162);
          textX.setAttribute("text-anchor", "middle");
          textX.setAttribute("fill", "#ffffff");
          textX.setAttribute("font-size", "10");
          textX.textContent = size;

          if (count > 0) {
            const textY = document.createElementNS(svgNS, "text");
            textY.setAttribute("x", x + (colWidth - 8) / 2);
            textY.setAttribute("y", y - 4);
            textY.setAttribute("text-anchor", "middle");
            textY.setAttribute("fill", "#60a5fa");
            textY.setAttribute("font-size", "10");
            textY.setAttribute("font-weight", "bold");
            textY.textContent = count;
            g.appendChild(textY);
          }

          g.appendChild(rect);
          g.appendChild(textX);
          svg.appendChild(g);
        });

        container.appendChild(svg);
      }

      function renderStatsList(sizeCounts) {
        const list = document.getElementById("stats-list");
        list.innerHTML = "";

        ALL_SIZES.forEach((s) => {
          const count = sizeCounts[s];
          const item = document.createElement("div");
          item.className = `p-2 rounded-xl border text-xs flex justify-between items-center ${
            count > 0
              ? "bg-zinc-800 border-zinc-700 text-white font-medium"
              : "bg-zinc-900 border-zinc-800 text-white"
          }`;
          item.innerHTML = `<span>${s}</span> <span class="${count > 0 ? "text-blue-400 font-bold" : "text-white"}">${count} шт.</span>`;
          list.appendChild(item);
        });
      }

      function renderStatsSummary(totalPairs, totalPrice) {
        const summary = document.getElementById("stats-summary");
        summary.innerHTML = `
        <div class="flex justify-between items-center text-sm">
          <span class="text-white">Всего пар обуви:</span>
          <span class="text-white font-bold text-base">${totalPairs} шт.</span>
        </div>
        ${
          currentAdmin
            ? `
          <div class="flex justify-between items-center text-sm pt-2 border-t border-zinc-800">
            <span class="text-white">Общая сумма:</span>
            <span class="text-blue-400 font-bold text-lg">${totalPrice.toLocaleString("ru-RU")}</span>
          </div>
        `
            : ""
        }
      `;
      }

      function getDemoProducts() {
        return [
          {
            id: "1",
            price: 200,
            colors: ["Розовый"],
            types: ["Кроссовки"],
            genders: ["Д"],
            params: ["Тёплый"],
            sizes: [37, 38, 39, 40],
            extraSizes: [38],
            photo: "https://images.unsplash.com/photo-1542291026-7eec264c27ff",
            locationPhoto:
              "https://images.unsplash.com/photo-1586023492125-27b2c045efd7",
          },
        ];
      }
    </script>
    <div
      id="bottom-toast"
      class="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 hidden px-4 py-2 rounded-full bg-green-600 border border-green-500 text-white text-sm font-medium shadow-lg pointer-events-none transition-opacity duration-200"
    ></div>
  </body>
